name: PR Automation

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Auto Assign – Assignees & Reviewers
  # ─────────────────────────────────────────────
  auto-assign:
    name: Auto Assign Reviewers & Assignees
    runs-on: ubuntu-latest
    steps:
      - name: Auto Assign
        uses: kentaro-m/auto-assign-action@v2.0.1
        with:
          configuration-path: '.github/auto_assign.yml'

  # ─────────────────────────────────────────────
  # 2. Auto Labeler
  # ─────────────────────────────────────────────
  labeler:
    name: Auto Label
    runs-on: ubuntu-latest
    steps:
      - name: Auto Label
        id: labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: '.github/labeler.yml'
          sync-labels: true
          dot: true

  # ─────────────────────────────────────────────
  # 3. PR 오픈 알림 (opened 이벤트만)
  # ─────────────────────────────────────────────
  discord-pr-opened:
    name: Discord PR 오픈 알림
    runs-on: ubuntu-latest
    needs: [auto-assign, labeler]
    if: github.event.action == 'opened'
    steps:
      - name: Discord – 새 PR 알림
        uses: sarisia/actions-status-discord@v1
        with:
          # ── 필수 ──────────────────────────────
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

          # ── 상태 & 콘텐츠 ──────────────────────
          status: success
          content: '새로운 PR이 열렸습니다! 리뷰 부탁드려요 🙏'
          title: '🔔 새 Pull Request'
          description: |
            **${{ github.event.pull_request.title }}**

            작성자: @${{ github.event.pull_request.user.login }}
            베이스: `${{ github.event.pull_request.base.ref }}` ← `${{ github.event.pull_request.head.ref }}`
            변경 파일: ${{ github.event.pull_request.changed_files }}개
            커밋: ${{ github.event.pull_request.commits }}개
          url: ${{ github.event.pull_request.html_url }}

          # ── 외관 커스터마이징 ──────────────────
          username: 'Flooding Bot'
          avatar_url: 'https://github.com/team-incube.png'
          image: ''
          color: '0xEB459E'

          # ── 출력 제어 ──────────────────────────
          nofail: true
          nocontext: true
          noprefix: true
          nodetail: false
          notimestamp: false
          ack_no_webhook: true
