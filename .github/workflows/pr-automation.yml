name: PR Automation

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Auto Assign – Assignees & Reviewers
  # ─────────────────────────────────────────────
  auto-assign:
    name: Auto Assign Reviewers & Assignees
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Auto Assign
        uses: kentaro-m/auto-assign-action@v2.0.1
        with:
          configuration-path: ".github/auto_assign.yml"

  # ─────────────────────────────────────────────
  # 2. Auto Labeler
  # ─────────────────────────────────────────────
  labeler:
    name: Auto Label
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Auto Label
        id: labeler
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ".github/labeler.yml"
          sync-labels: true
          dot: true

  # ─────────────────────────────────────────────
  # 3. PR 오픈 알림 (opened 이벤트만)
  # ─────────────────────────────────────────────
  discord-pr-opened:
    name: Discord PR 오픈 알림
    runs-on: ubuntu-latest
    needs: [auto-assign, labeler]
    if: github.event.action == 'opened'
    steps:
      - name: Sarisia Discord Web Hook – New Pull Request Opened
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

          # ── 상태 & 콘텐츠 ──────────────────────
          status: ${{ job.status }}
          content: "<@FE> PR 확인해주세요."
          title: "${{ github.event.pull_request.title }}"
          description: |
            작성자: @${{ github.event.pull_request.user.login }}
            베이스: `${{ github.event.pull_request.base.ref }}` ← `${{ github.event.pull_request.head.ref }}`
            변경 파일: ${{ github.event.pull_request.changed_files }}개
            커밋: ${{ github.event.pull_request.commits }}개
          url: ${{ github.event.pull_request.html_url }}
          # ── 외관 커스터마이징 ──────────────────
          username: "Flooding Client Bot"
          avatar_url: ${{ secrets.DISCORD_AVATAR_URL }}
          color: "0xEB459E"

          # ── 출력 제어 ──────────────────────────
          nofail: true
          nocontext: true
          noprefix: true
          nodetail: false
          notimestamp: false
          ack_no_webhook: true
