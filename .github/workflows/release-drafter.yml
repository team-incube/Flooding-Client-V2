name: Release Drafter

# 자동 실행하지 않는다. 릴리즈 PR(develop → main)에 `/release-draft` 댓글을 달면
# 그 시점에 릴리즈 노트 초안을 생성/갱신한다. (Actions 탭의 Run workflow 도 가능)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 버전 (예: 2.0.6). 비워두면 직전 태그를 기준으로 patch 버전이 자동 증가한다."
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Update Release Draft
    # 수동 실행이거나, PR에 멤버가 `/release-draft` 댓글을 단 경우에만 실행
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/release-draft') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      # 워크플로우 입력 또는 `/release-draft [version]` 댓글에서 버전을 추출한다.
      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            version="$(printf '%s' "$COMMENT_BODY" | awk 'NR==1{print $2}')"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft release notes
        id: draft
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
          commitish: refs/heads/main
          version: ${{ steps.resolve.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 댓글로 실행한 경우, 생성된 draft 링크를 PR에 회신한다.
      - name: Comment draft link
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DRAFT_URL: ${{ steps.draft.outputs.html_url }}
        run: |
          gh pr comment "$PR_NUMBER" --body "📝 릴리즈 노트 초안을 갱신했습니다: $DRAFT_URL"
